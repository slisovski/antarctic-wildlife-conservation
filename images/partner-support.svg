<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Ways to support Antarctic Wildlife Conservation</title>
<desc id="desc">Three connected hexagons: Expeditions, with Funding and Logistics; Research Equipment, with Tracking Devices and Field Instruments; Education, with Learning Materials and Outreach.</desc>
<defs>
 <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f0f5f6"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f69b40"/><stop offset="1" stop-color="#dc6c05"/></linearGradient>
 <filter id="shadow" x="-30%" y="-25%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#163b4a" flood-opacity=".075"/></filter>
 <polygon id="hex" points="0,-145 125.6,-72.5 125.6,72.5 0,145 -125.6,72.5 -125.6,-72.5"/>
</defs>
<rect width="1200" height="440" fill="#f8fafb"/>
<!-- Quiet connecting routes, echoing movement tracks. -->
<g fill="none" stroke="#ed7d0f" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 7" opacity=".7">
 <path d="M355.6 220C398 192 432 248 474.4 220"/>
 <path d="M725.6 220C768 248 802 192 844.4 220"/>
</g>
<g fill="#f8fafb" stroke="#ed7d0f" stroke-width="1.6">
 <circle cx="415" cy="220" r="4"/><circle cx="785" cy="220" r="4"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
 <g transform="translate(230 220)">
  <use href="#hex" fill="url(#surface)" stroke="url(#edge)" stroke-width="2.2" filter="url(#shadow)"/>
  <use href="#hex" transform="scale(.94)" fill="none" stroke="#e6edef" stroke-width="1"/>
  <path d="M-18 -113L0 -123L18 -113" fill="none" stroke="#ed7d0f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text y="-8" fill="#163b4a" font-size="25" font-weight="600" letter-spacing="-.5">Expeditions</text>
  <path d="M-15 15H15" stroke="#ed7d0f" stroke-width="2" stroke-linecap="round"/>
  <text y="47" fill="#526c78" font-size="16">Funding · Logistics</text>
 </g>
 <g transform="translate(600 220)">
  <use href="#hex" fill="url(#surface)" stroke="url(#edge)" stroke-width="2.2" filter="url(#shadow)"/>
  <use href="#hex" transform="scale(.94)" fill="none" stroke="#e6edef" stroke-width="1"/>
  <path d="M-18 -113L0 -123L18 -113" fill="none" stroke="#ed7d0f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text y="-24" fill="#163b4a" font-size="25" font-weight="600" letter-spacing="-.5">Research</text>
  <text y="6" fill="#163b4a" font-size="25" font-weight="600" letter-spacing="-.5">Equipment</text>
  <path d="M-15 29H15" stroke="#ed7d0f" stroke-width="2" stroke-linecap="round"/>
  <text y="59" fill="#526c78" font-size="15">Tracking devices</text>
  <text y="81" fill="#526c78" font-size="15">Field instruments</text>
 </g>
 <g transform="translate(970 220)">
  <use href="#hex" fill="url(#surface)" stroke="url(#edge)" stroke-width="2.2" filter="url(#shadow)"/>
  <use href="#hex" transform="scale(.94)" fill="none" stroke="#e6edef" stroke-width="1"/>
  <path d="M-18 -113L0 -123L18 -113" fill="none" stroke="#ed7d0f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text y="-8" fill="#163b4a" font-size="25" font-weight="600" letter-spacing="-.5">Education</text>
  <path d="M-15 15H15" stroke="#ed7d0f" stroke-width="2" stroke-linecap="round"/>
  <text y="47" fill="#526c78" font-size="16">Learning materials</text>
  <text y="70" fill="#526c78" font-size="16">Outreach</text>
 </g>
</g>
</svg>
